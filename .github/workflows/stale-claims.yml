name: stale-claims

# Warns, then releases issues an agent claimed but isn't progressing on
# (thresholds in .github/agents.yml: claim_draft_pr_hours, claim_idle_hours).

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, change nothing"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: stale-claims
  cancel-in-progress: false

jobs:
  stale-claims:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts/governance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Check claims
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=(--config .github/agents.yml --repo "$GITHUB_REPOSITORY")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/governance/gov.py stale-claims "${args[@]}"
