name: governance-selftest

# Unit tests for the governance scripts. Path-filtered, so NOT a required check.

on:
  pull_request:
    paths:
      - scripts/governance/**
      - .github/agents.yml
      - .github/workflows/agent-governance.yml
  push:
    branches: [main]
    paths:
      - scripts/governance/**

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r scripts/governance/requirements.txt
      - run: python -m pytest -q scripts/governance/tests
